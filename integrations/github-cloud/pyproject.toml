[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-cloud"
version = "0.1.0"
description = "GitHub Cloud integration for Port"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Port", email = "support@getport.io" }
]
dependencies = [
    "port-ocean>=0.1.0",
    "aiohttp>=3.8.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.poetry]
name = "github-cloud"
version = "0.1.0"
description = "GitHub Cloud integration for Port"
authors = ["Port"]

[tool.poetry.dependencies]
python = "^3.11"
port_ocean = {git = "https://github.com/port-labs/ocean.git"}
aiohttp = "^3.9.1"
pydantic = "^2.5.2"
tenacity = "^9.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-httpx = "^0.30.0"
black = "^23.11.0"
mypy = "^1.7.1"
ruff = "^0.1.6"
towncrier = "^23.6.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
select = ["E", "F", "B", "I"]
line-length = 120

[tool.towncrier]
directory = "changelog"
filename = "CHANGELOG.md"
title_format = "## {version} ({project_date})"
underlines = [""]

  [[tool.towncrier.type]]
  directory = "breaking"
  name = "Breaking Changes"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "deprecation"
  name = "Deprecations"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "feature"
  name = "Features"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "improvement"
  name = "Improvements"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "bugfix"
  name = "Bug Fixes"
  showcontent = true

  [[tool.towncrier.type]]
  directory = "doc"
  name = "Improved Documentation"
  showcontent = true 